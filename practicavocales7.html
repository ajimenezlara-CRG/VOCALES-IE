<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica de vocales E e I</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- APP PRINCIPAL -->
  <div id="app" class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">

    <h1 class="text-2xl font-bold mb-4 text-center text-indigo-600">
      Práctica de vocales E e I
    </h1>

    <p id="definition" class="mb-4 text-gray-700"></p>

    <div class="mb-4">
      <label class="block text-gray-600 mb-2">Completa la palabra:</label>
      <div id="wordContainer" class="flex justify-center gap-2 flex-wrap text-xl font-semibold mb-2"></div>
    </div>

    <div class="text-center mb-4 text-gray-600">
      Tiempo: <span id="timer">0.0</span> s
    </div>

    <button onclick="checkAnswer()" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 w-full">
      Comprobar
    </button>

    <button onclick="speakWord()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 w-full mt-3">
      Escuchar palabra
    </button>

    <p id="message" class="mt-4 text-center font-medium"></p>

    <div class="mt-4 text-sm text-gray-600 text-center">
      Aciertos: <span id="correct">0</span> |
      Fallos: <span id="incorrect">0</span> |
      Palabras: <span id="count">0</span>/10
    </div>
  </div>

  <!-- RESUMEN FINAL -->
  <div id="summary" class="hidden bg-white p-6 rounded-lg shadow-lg w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-indigo-600 mb-4">Resumen</h2>
    <p id="summaryText" class="text-gray-700 mb-4"></p>
    <button onclick="restart()" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 w-full">
      Volver a empezar
    </button>
  </div>

  <script>
    const words = [
      { word: "perejil", definition: "Planta aromática usada en cocina." },
      { word: "mesa", definition: "Mueble con superficie plana para comer o trabajar." },
      { word: "limón", definition: "Fruta amarilla de sabor ácido." },
      { word: "película", definition: "Obra cinematográfica." },
      { word: "bicicleta", definition: "Vehículo de dos ruedas movido por pedales." },
      { word: "pisar", definition: "Poner el pie sobre algo." },
      { word: "pesar", definition: "Determinar el peso de algo." },
      { word: "lima", definition: "Fruta o herramienta para limar." },
      { word: "lema", definition: "Frase que expresa una idea o propósito." },
      { word: "pipa", definition: "Semilla de girasol o instrumento para fumar." },
      { word: "Pepa", definition: "Nombre propio femenino." },
      { word: "recurrir", definition: "Acudir a alguien o algo para obtener ayuda." },
      { word: "recorrer", definition: "Ir de un lugar a otro atravesándolo." }
    ];

    let correct = 0;
    let incorrect = 0;
    let count = 0;
    let currentWord = {};
    let startTime = 0;
    let timerInterval;
    let wordSet = [];

    let globalStats = JSON.parse(localStorage.getItem("vocalStats") || "{}");
    if (!globalStats.tandas) globalStats = { tandas: 0, aciertos: 0, fallos: 0 };

    function playDing() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function playBuzz() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.frequency.value = 120;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }

    function generateWordSet() {
      const shuffled = [...words].sort(() => Math.random() - 0.5);
      wordSet = shuffled.slice(0, 10);
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById("timer").textContent = elapsed;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function newWord() {
      if (count >= 10) return showSummary();

      currentWord = wordSet[count];
      document.getElementById("definition").textContent = currentWord.definition;
      document.getElementById("message").textContent = "";

      const container = document.getElementById("wordContainer");
      container.innerHTML = "";

      [...currentWord.word].forEach((char, index) => {
        if (/[eiEI]/.test(char)) {
          const wrapper = document.createElement("div");
          wrapper.className = "flex flex-col items-center";

          const display = document.createElement("div");
          display.className = "w-6 h-8 border-b-2 border-gray-400 text-center";
          display.dataset.index = index;
          wrapper.appendChild(display);

          const buttons = document.createElement("div");
          buttons.className = "flex gap-1 mt-1";

          const btnE = document.createElement("button");
          btnE.textContent = "e";
          btnE.className = "px-2 py-1 bg-blue-300 rounded hover:bg-blue-400 text-sm";
          btnE.onclick = () => (display.textContent = "e");

          const btnI = document.createElement("button");
          btnI.textContent = "i";
          btnI.className = "px-2 py-1 bg-red-300 rounded hover:bg-red-400 text-sm";
          btnI.onclick = () => (display.textContent = "i");

          buttons.appendChild(btnE);
          buttons.appendChild(btnI);
          wrapper.appendChild(buttons);
          container.appendChild(wrapper);
        } else {
          const span = document.createElement("span");
          span.textContent = char;
          container.appendChild(span);
        }
      });

      speakWord();
      startTimer();
    }

    function checkAnswer() {
      stopTimer();
      count++;

      let reconstructed = [...currentWord.word];
      const displays = document.querySelectorAll("#wordContainer div[data-index]");

      displays.forEach(display => {
        const index = display.dataset.index;
        reconstructed[index] = display.textContent.toLowerCase();
      });

      const finalWord = reconstructed.join("");

      if (finalWord.toLowerCase() === currentWord.word.toLowerCase()) {
        correct++;
        playDing();
        animateMessage("¡Correcto!", "text-green-600");
      } else {
        incorrect++;
        playBuzz();
        animateMessage(`Incorrecto. Era "${currentWord.word}".`, "text-red-600");
      }

      document.getElementById("correct").textContent = correct;
      document.getElementById("incorrect").textContent = incorrect;
      document.getElementById("count").textContent = count;

      setTimeout(newWord, 1500);
    }

    function animateMessage(text, colorClass) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = `mt-4 text-center font-medium ${colorClass} transition transform scale-125`;
      setTimeout(() => msg.classList.remove("scale-125"), 200);
    }

    function speakWord() {
      const utterance = new SpeechSynthesisUtterance(currentWord.word);
      utterance.lang = "es-ES";
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    function showSummary() {
      globalStats.tandas++;
      globalStats.aciertos += correct;
      globalStats.fallos += incorrect;
      localStorage.setItem("vocalStats", JSON.stringify(globalStats));

      document.getElementById("app").classList.add("hidden");
      document.getElementById("summary").classList.remove("hidden");

      document.getElementById("summaryText").innerHTML = `
        <p class="text-lg mb-2">Has completado 10 palabras distintas.</p>
        <p class="text-green-600 font-bold">Aciertos: ${correct}</p>
        <p class="text-red-600 font-bold">Fallos: ${incorrect}</p>
        <hr class="my-3">
        <p class="text-indigo-600 font-bold">Progreso total:</p>
        <p>Tandas completadas: ${globalStats.tandas}</p>
        <p>Aciertos acumulados: ${globalStats.aciertos}</p>
        <p>Fallos acumulados: ${globalStats.fallos}</p>
      `;
    }

    function restart() {
      correct = 0;
      incorrect = 0;
      count = 0;

      document.getElementById("correct").textContent = 0;
      document.getElementById("incorrect").textContent = 0;
      document.getElementById("count").textContent = 0;

      document.getElementById("summary").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");

      generateWordSet();
      newWord();
    }

    window.onload = () => {
      generateWordSet();
      newWord();
    };
  </script>

</body>
</html>
