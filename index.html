<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocales E e I</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vocales E/I">

  <!-- Icono para iOS (puedes cambiar la ruta cuando tengas un PNG real) -->
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .icono-palabra {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>

<body class="bg-gradient-to-b from-blue-50 to-blue-100 min-h-screen flex items-center justify-center">

  <!-- APP PRINCIPAL -->
  <div id="app" class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md transition-all">

    <!-- SELECTOR VISUAL -->
    <div class="flex justify-center gap-4 mb-4">
      <button id="modoNormalBtn"
        onclick="setMode(false)"
        class="flex flex-col items-center p-3 bg-indigo-200 hover:bg-indigo-300 rounded-xl shadow">
        <span class="text-3xl">🎨</span>
        <span class="text-sm font-semibold">Normal</span>
      </button>

      <button id="modoInfantilBtn"
        onclick="setMode(true)"
        class="flex flex-col items-center p-3 bg-yellow-200 hover:bg-yellow-300 rounded-xl shadow">
        <span class="text-3xl">🧸</span>
        <span class="text-sm font-semibold">Infantil</span>
      </button>
    </div>

    <h1 id="title" class="text-2xl font-bold mb-4 text-center text-indigo-600">
      Práctica de vocales E e I
    </h1>

    <!-- IMAGEN / ICONO -->
    <div class="flex justify-center mb-3">
      <div id="imageContainer"></div>
    </div>

    <p id="definition" class="mb-4 text-gray-700 text-center"></p>

    <div class="mb-4">
      <label id="labelCompleta" class="block text-gray-600 mb-2 text-center">Completa la palabra:</label>

      <div id="wordContainer"
        class="flex justify-center gap-3 flex-nowrap text-xl font-semibold mb-2 whitespace-nowrap overflow-x-auto">
      </div>
    </div>

    <div class="text-center mb-4 text-gray-600">
      Tiempo: <span id="timer">0.0</span> s
    </div>

    <button id="btnComprobar"
      onclick="checkAnswer()"
      class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 w-full">
      Comprobar
    </button>

    <button id="btnEscuchar"
      onclick="speakWord()"
      class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 w-full mt-3">
      Escuchar palabra
    </button>

    <p id="message" class="mt-4 text-center font-medium"></p>

    <div class="mt-4 text-sm text-gray-600 text-center">
      Aciertos: <span id="correct">0</span> |
      Fallos: <span id="incorrect">0</span> |
      Palabras: <span id="count">0</span>/10
    </div>
  </div>

  <!-- RESUMEN FINAL -->
  <div id="summary" class="hidden bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-indigo-600 mb-4">Resumen</h2>
    <p id="summaryText" class="text-gray-700 mb-4"></p>
    <button onclick="restart()" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600 w-full">
      Volver a empezar
    </button>
  </div>

  <!-- ICONOS SVG (los mismos que ya tenías) -->
  <!-- 1. PEREJIL -->
  <svg id="icon-perejil" class="icono-palabra hidden" viewBox="0 0 100 100">
    <path d="M50 10 C30 20, 20 40, 35 55 C20 60, 25 80, 45 75 C40 90, 60 90, 55 75 C75 80, 80 60, 65 55 C80 40, 70 20, 50 10 Z"
          fill="#4CAF50" stroke="#2E7D32" stroke-width="3"/>
  </svg>

  <!-- 2. MESA -->
  <svg id="icon-mesa" class="icono-palabra hidden" viewBox="0 0 100 100">
    <rect x="10" y="35" width="80" height="15" fill="#A1887F" stroke="#6D4C41" stroke-width="3"/>
    <rect x="20" y="50" width="10" height="35" fill="#8D6E63"/>
    <rect x="70" y="50" width="10" height="35" fill="#8D6E63"/>
  </svg>

  <!-- 3. LIMÓN -->
  <svg id="icon-limon" class="icono-palabra hidden" viewBox="0 0 100 100">
    <ellipse cx="50" cy="50" rx="35" ry="25" fill="#FFEB3B" stroke="#FBC02D" stroke-width="4"/>
    <circle cx="50" cy="50" r="10" fill="#FFF59D"/>
  </svg>

  <!-- 4. PELÍCULA -->
  <svg id="icon-pelicula" class="icono-palabra hidden" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="35" fill="#B0BEC5" stroke="#455A64" stroke-width="4"/>
    <circle cx="50" cy="25" r="6" fill="#455A64"/>
    <circle cx="75" cy="50" r="6" fill="#455A64"/>
    <circle cx="50" cy="75" r="6" fill="#455A64"/>
    <circle cx="25" cy="50" r="6" fill="#455A64"/>
  </svg>

  <!-- 5. BICICLETA -->
  <svg id="icon-bicicleta" class="icono-palabra hidden" viewBox="0 0 100 100">
    <circle cx="25" cy="65" r="15" fill="none" stroke="#37474F" stroke-width="4"/>
    <circle cx="75" cy="65" r="15" fill="none" stroke="#37474F" stroke-width="4"/>
    <path d="M25 65 L45 40 L60 65 L75 65" stroke="#37474F" stroke-width="4" fill="none"/>
    <circle cx="45" cy="40" r="4" fill="#37474F"/>
  </svg>

  <!-- 6. PISAR -->
  <svg id="icon-pisar" class="icono-palabra hidden" viewBox="0 0 100 100">
    <ellipse cx="50" cy="65" rx="20" ry="28" fill="#FFCC80" stroke="#FB8C00" stroke-width="3"/>
    <circle cx="40" cy="30" r="6" fill="#FFCC80"/>
    <circle cx="50" cy="25" r="6" fill="#FFCC80"/>
    <circle cx="60" cy="30" r="6" fill="#FFCC80"/>
  </svg>

  <!-- 7. PESAR -->
  <svg id="icon-pesar" class="icono-palabra hidden" viewBox="0 0 100 100">
    <rect x="20" y="25" width="60" height="50" rx="8" fill="#CFD8DC" stroke="#607D8B" stroke-width="4"/>
    <circle cx="50" cy="40" r="10" fill="#90A4AE"/>
    <rect x="35" y="55" width="30" height="10" fill="#78909C"/>
  </svg>

  <!-- 8. LIMA -->
  <svg id="icon-lima" class="icono-palabra hidden" viewBox="0 0 100 100">
    <ellipse cx="50" cy="50" rx="32" ry="22" fill="#8BC34A" stroke="#558B2F" stroke-width="4"/>
    <circle cx="50" cy="50" r="10" fill="#DCEDC8"/>
  </svg>

  <!-- 9. LEMA -->
  <svg id="icon-lema" class="icono-palabra hidden" viewBox="0 0 100 100">
    <rect x="15" y="25" width="70" height="40" rx="8" fill="#BBDEFB" stroke="#1976D2" stroke-width="3"/>
    <polygon points="35,65 45,55 55,65" fill="#BBDEFB" stroke="#1976D2" stroke-width="3"/>
  </svg>

  <!-- 10. PIPA -->
  <svg id="icon-pipa" class="icono-palabra hidden" viewBox="0 0 100 100">
    <ellipse cx="50" cy="55" rx="18" ry="28" fill="#795548" stroke="#5D4037" stroke-width="4"/>
    <ellipse cx="50" cy="55" rx="8" ry="18" fill="#A1887F"/>
  </svg>

  <!-- 11. PEPA -->
  <svg id="icon-pepa" class="icono-palabra hidden" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="30" fill="#FFE082" stroke="#FBC02D" stroke-width="4"/>
    <circle cx="40" cy="45" r="5" fill="#5D4037"/>
    <circle cx="60" cy="45" r="5" fill="#5D4037"/>
    <path d="M38 60 Q50 70 62 60" stroke="#5D4037" stroke-width="4" fill="none"/>
  </svg>

  <!-- 12. RECURRIR -->
  <svg id="icon-recurrir" class="icono-palabra hidden" viewBox="0 0 100 100">
    <path d="M20 60 C30 40, 50 40, 60 60 C70 80, 90 80, 80 60"
          fill="#FFCC80" stroke="#FB8C00" stroke-width="4"/>
    <circle cx="30" cy="35" r="10" fill="#FFCC80" stroke="#FB8C00" stroke-width="3"/>
  </svg>

  <!-- 13. RECORRER -->
  <svg id="icon-recorrer" class="icono-palabra hidden" viewBox="0 0 100 100">
    <path d="M20 80 Q40 60, 50 70 T80 40"
          stroke="#8D6E63" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="80" r="6" fill="#6D4C41"/>
    <circle cx="80" cy="40" r="6" fill="#6D4C41"/>
  </svg>

  <script>
    const words = [
      { word: "perejil", definition: "Planta aromática usada en cocina.", icon: "icon-perejil" },
      { word: "mesa", definition: "Mueble con superficie plana para comer o trabajar.", icon: "icon-mesa" },
      { word: "limón", definition: "Fruta amarilla de sabor ácido.", icon: "icon-limon" },
      { word: "película", definition: "Obra cinematográfica.", icon: "icon-pelicula" },
      { word: "bicicleta", definition: "Vehículo de dos ruedas movido por pedales.", icon: "icon-bicicleta" },
      { word: "pisar", definition: "Poner el pie sobre algo.", icon: "icon-pisar" },
      { word: "pesar", definition: "Determinar el peso de algo.", icon: "icon-pesar" },
      { word: "lima", definition: "Fruta o herramienta para limar.", icon: "icon-lima" },
      { word: "lema", definition: "Frase que expresa una idea o propósito.", icon: "icon-lema" },
      { word: "pipa", definition: "Semilla de girasol o instrumento para fumar.", icon: "icon-pipa" },
      { word: "Pepa", definition: "Nombre propio femenino.", icon: "icon-pepa" },
      { word: "recurrir", definition: "Acudir a alguien o algo para obtener ayuda.", icon: "icon-recurrir" },
      { word: "recorrer", definition: "Ir de un lugar a otro atravesándolo.", icon: "icon-recorrer" }
    ];

    let correct = 0;
    let incorrect = 0;
    let count = 0;
    let currentWord = {};
    let startTime = 0;
    let timerInterval;
    let wordSet = [];
    let infantil = false;

    let globalStats = JSON.parse(localStorage.getItem("vocalStats") || "{}");
    if (!globalStats.tandas) globalStats = { tandas: 0, aciertos: 0, fallos: 0 };

    function playDing() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.frequency.value = 880;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    }

    function playBuzz() {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      osc.frequency.value = 120;
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    }

    function generateWordSet() {
      const shuffled = [...words].sort(() => Math.random() - 0.5);
      wordSet = shuffled.slice(0, 10);
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById("timer").textContent = elapsed;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function newWord() {
      if (count >= 10) return showSummary();

      currentWord = wordSet[count];
      document.getElementById("definition").textContent = currentWord.definition;
      document.getElementById("message").textContent = "";

      const container = document.getElementById("imageContainer");
      container.innerHTML = "";
      const icon = document.getElementById(currentWord.icon).cloneNode(true);
      icon.classList.remove("hidden");
      container.appendChild(icon);

      const wordContainer = document.getElementById("wordContainer");
      wordContainer.innerHTML = "";

      [...currentWord.word].forEach((char, index) => {
        if (/[eiEI]/.test(char)) {
          const wrapper = document.createElement("div");
          wrapper.className = infantil ? "flex flex-col items-center scale-150" : "flex flex-col items-center";

          const display = document.createElement("div");
          display.className = infantil
            ? "w-10 h-12 border-b-4 border-gray-400 text-center text-3xl"
            : "w-6 h-8 border-b-2 border-gray-400 text-center";
          display.dataset.index = index;
          wrapper.appendChild(display);

          const buttons = document.createElement("div");
          buttons.className = infantil ? "flex gap-2 mt-2" : "flex gap-1 mt-1";

          const btnE = document.createElement("button");
          btnE.innerHTML = infantil ? "🟦 <b>e</b>" : "e";
          btnE.className = infantil
            ? "px-3 py-2 bg-blue-300 rounded-full hover:bg-blue-400 text-xl"
            : "px-2 py-1 bg-blue-300 rounded hover:bg-blue-400 text-sm";
          btnE.onclick = () => (display.textContent = "e");

          const btnI = document.createElement("button");
          btnI.innerHTML = infantil ? "🟥 <b>i</b>" : "i";
          btnI.className = infantil
            ? "px-3 py-2 bg-red-300 rounded-full hover:bg-red-400 text-xl"
            : "px-2 py-1 bg-red-300 rounded hover:bg-red-400 text-sm";
          btnI.onclick = () => (display.textContent = "i");

          buttons.appendChild(btnE);
          buttons.appendChild(btnI);
          wrapper.appendChild(buttons);
          wordContainer.appendChild(wrapper);

        } else {
          const span = document.createElement("span");
          span.textContent = char;
          span.className = infantil ? "text-3xl" : "";
          wordContainer.appendChild(span);
        }
      });

      speakWord();
      startTimer();
    }

    function checkAnswer() {
      stopTimer();
      count++;

      let reconstructed = [...currentWord.word];
      const displays = document.querySelectorAll("#wordContainer div[data-index]");

      displays.forEach(display => {
        const index = display.dataset.index;
        reconstructed[index] = display.textContent.toLowerCase();
      });

      const finalWord = reconstructed.join("");

      if (finalWord.toLowerCase() === currentWord.word.toLowerCase()) {
        correct++;
        playDing();
        animateMessage("¡Correcto!", "text-green-600");
      } else {
        incorrect++;
        playBuzz();
        animateMessage(`Incorrecto. Era "${currentWord.word}".`, "text-red-600");
      }

      document.getElementById("correct").textContent = correct;
      document.getElementById("incorrect").textContent = incorrect;
      document.getElementById("count").textContent = count;

      setTimeout(newWord, 1500);
    }

    function animateMessage(text, colorClass) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = `mt-4 text-center font-medium ${colorClass} transition transform scale-125`;
      setTimeout(() => msg.classList.remove("scale-125"), 200);
    }

    function speakWord() {
      const utterance = new SpeechSynthesisUtterance(currentWord.word);
      utterance.lang = "es-ES";
      utterance.rate = infantil ? 0.8 : 0.9;
      speechSynthesis.speak(utterance);
    }

    function showSummary() {
      globalStats.tandas++;
      globalStats.aciertos += correct;
      globalStats.fallos += incorrect;
      localStorage.setItem("vocalStats", JSON.stringify(globalStats));

      document.getElementById("app").classList.add("hidden");
      document.getElementById("summary").classList.remove("hidden");

      document.getElementById("summaryText").innerHTML = `
        <p class="text-lg mb-2">Has completado 10 palabras distintas.</p>
        <p class="text-green-600 font-bold">Aciertos: ${correct}</p>
        <p class="text-red-600 font-bold">Fallos: ${incorrect}</p>
        <hr class="my-3">
        <p class="text-indigo-600 font-bold">Progreso total:</p>
        <p>Tandas completadas: ${globalStats.tandas}</p>
        <p>Aciertos acumulados: ${globalStats.aciertos}</p>
        <p>Fallos acumulados: ${globalStats.fallos}</p>
      `;
    }

    function restart() {
      correct = 0;
      incorrect = 0;
      count = 0;

      document.getElementById("correct").textContent = 0;
      document.getElementById("incorrect").textContent = 0;
      document.getElementById("count").textContent = 0;

      document.getElementById("summary").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");

      generateWordSet();
      newWord();
    }

    function setMode(isInfantil) {
      infantil = isInfantil;

      document.getElementById("modoInfantilBtn").classList.toggle("ring-4", infantil);
      document.getElementById("modoNormalBtn").classList.toggle("ring-4", !infantil);

      document.getElementById("title").className =
        infantil ? "text-4xl font-bold mb-4 text-center text-indigo-600" :
                   "text-2xl font-bold mb-4 text-center text-indigo-600";

      restart();
    }

    window.onload = () => {
      generateWordSet();
      newWord();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
      }
    };
  </script>
</body>
</html>
